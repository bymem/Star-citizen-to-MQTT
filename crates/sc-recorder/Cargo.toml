[package]
name = "sc-recorder"
version = "0.1.0"
description = "Records Star Citizen gRPC telemetry for offline development of the SC MQTT Companion"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
http = "1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-std", "io-util", "sync"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
