# Workspace for the SC MQTT Companion. Phase 0 is sc-recorder; the companion
# crate will be added beside it later.
[workspace]
resolver = "3"
members = ["crates/sc-recorder"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bymem/Star-citizen-to-MQTT"

# Small, self-contained release binaries (spec §9: target well under 15 MB).
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
