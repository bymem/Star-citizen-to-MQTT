name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail fast before spending time on builds.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Tag must match Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "sc-recorder") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: sc-recorder.exe
            platform: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: sc-recorder
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p sc-recorder --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cd dist
          base="sc-recorder-${VERSION}-${{ matrix.platform }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp ../packaging/README.txt .
            pkg="$base.zip"
            7z a -tzip "$pkg" "${{ matrix.bin }}" README.txt > /dev/null
          else
            pkg="$base.tar.gz"
            tar czf "$pkg" "${{ matrix.bin }}"
          fi
          sha256sum "$pkg" > "$pkg.sha256"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/${{ steps.package.outputs.pkg }}
            dist/${{ steps.package.outputs.pkg }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm *.sha256
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # v0.2.0-rc.1 and similar are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
